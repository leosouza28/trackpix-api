upstream trackpix_api {
    server 127.0.0.1:8005;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.trackpix.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.trackpix.com.br;

    # ssl_certificate /etc/letsencrypt/live/api.trackpix.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.trackpix.com.br/privkey.pem;
    # (preenchido automaticamente pelo certbot --nginx)

    client_max_body_size 20m;

    location / {
        proxy_pass http://trackpix_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
